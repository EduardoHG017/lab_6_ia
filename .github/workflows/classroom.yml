name: "Laboratorio 6 - Preprocesamiento de Imagenes"

on:
  - push
  - workflow_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  autograding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: to_grayscale (10 pts)
        run: pytest tests/test_preprocessing.py::TestToGrayscale -v --tb=short

      - name: resize_image (10 pts)
        run: pytest tests/test_preprocessing.py::TestResizeImage -v --tb=short

      - name: apply_blur (15 pts)
        run: pytest tests/test_preprocessing.py::TestApplyBlur -v --tb=short

      - name: apply_threshold (15 pts)
        run: pytest tests/test_preprocessing.py::TestApplyThreshold -v --tb=short

      - name: adjust_brightness_contrast (15 pts)
        run: pytest tests/test_preprocessing.py::TestAdjustBrightnessContrast -v --tb=short

      - name: detect_edges (15 pts)
        run: pytest tests/test_preprocessing.py::TestDetectEdges -v --tb=short

      - name: full_pipeline (20 pts)
        run: pytest tests/test_preprocessing.py::TestFullPipeline -v --tb=short
